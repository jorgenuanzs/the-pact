  /v1/projects/{project_id}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Events
      operationId: listProjectEvents
      summary: Lista eventos duraderos de un proyecto
      description: |
        Devuelve eventos posteriores al cursor indicado y ordenados por su
        secuencia dentro del proyecto. Si `after` se omite, la lectura comienza
        antes del primer evento disponible.

        Para un historial orientado a personas, `order=desc` devuelve primero
        los eventos recientes. En ese modo, `before` permite cargar páginas
        anteriores y `q` busca dentro del tipo, referencias, identidades y datos
        del evento.

        Aunque el cursor actual contiene la representación decimal de un
        `bigint`, los clientes deben tratarlo como una cadena opaca: solo deben
        almacenarlo y devolverlo, nunca realizar cálculos con él.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AfterCursor"
        - $ref: "#/components/parameters/BeforeCursor"
        - $ref: "#/components/parameters/EventLimit"
        - $ref: "#/components/parameters/EventOrder"
        - $ref: "#/components/parameters/EventSearch"
      responses:
        "200":
          description: Página de eventos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/projects/{project_id}/events/stream:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Events
      operationId: streamProjectEvents
      summary: Sigue los eventos de un proyecto mediante SSE
      description: |
        Primero reproduce los eventos duraderos posteriores a `Last-Event-ID` y
        después mantiene abierta la conexión para enviar eventos nuevos.

        Cada mensaje utiliza la secuencia del proyecto en el campo SSE `id`, el
        tipo del evento en `event` y el objeto `ProjectEvent` serializado como
        JSON en `data`. Los comentarios SSE pueden utilizarse como heartbeat y
        deben ignorarse. Si la conexión termina, el cliente debe reconectarse
        enviando el último `id` procesado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Stream SSE abierto.
          headers:
            Cache-Control:
              description: Los streams no se almacenan en caché.
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 1
                event: pact.project.created.v1
                data: {"id":"019c3fd8-2b34-7a10-8b75-3fd40dcfb68f","project_id":"019c3fd8-2b34-7a10-8b75-3fd40dcfb68e","sequence":"1","type":"pact.project.created.v1","version":1,"aggregate_type":"project","aggregate_id":"019c3fd8-2b34-7a10-8b75-3fd40dcfb68e","aggregate_version":1,"command_id":"019c3fd8-2b34-7a10-8b75-3fd40dcfb690","correlation_id":"019c3fd8-2b34-7a10-8b75-3fd40dcfb690","occurred_at":"2026-07-25T12:00:00Z","recorded_at":"2026-07-25T12:00:00Z","data":{"name":"The Pact","slug":"the-pact"}}

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
