      responses:
        "200": { description: Correo, proyecto, rol y expiración de la invitación. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/invitations/register:
    post:
      tags: [Authentication]
      operationId: registerInvitedAccount
      summary: Crea una cuenta local, acepta la invitación e inicia sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AccountRegistrationRequest"
                - type: object
                  required: [secret]
                  properties:
                    secret: { type: string, writeOnly: true, pattern: "^pact_inv_" }
      responses:
        "201": { $ref: "#/components/responses/WebSessionCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/auth/invitations/accept:
    post:
      tags: [Authentication]
      operationId: acceptInvitationForCurrentAccount
      summary: Añade una invitación a una cuenta ya autenticada
      security:
        - browserSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string, writeOnly: true, pattern: "^pact_inv_" }
      responses:
        "200": { description: Invitación aceptada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Credencial opaca pact_device_*, limitada a un dispositivo y revocable.
    browserSession:
      type: apiKey
      in: cookie
      name: pact_session
      description: Cookie opaca HttpOnly, Secure en HTTPS y SameSite=Strict.
    csrfHeader:
      type: apiKey
      in: header
      name: X-Pact-CSRF
      description: Secreto CSRF leído de la cookie pact_csrf y ligado a la sesión web.
  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      description: Identificador del Workspace compartido.
      schema:
        type: string
        format: uuid
    RoomId:
      name: room_id
      in: path
      required: true
      description: Identificador de una room del Workspace.
      schema:
        type: string
        format: uuid
    MentionId:
      name: mention_id
      in: path
      required: true
      description: Identificador de una mención explícita.
      schema:
        type: string
        format: uuid
    RoomMentionStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [pending, read, responded, dismissed, all]
        default: pending
    RoomInboxWorkspace:
      name: workspace_id
      in: query
      required: false
      description: Limita el inbox a un Workspace para evitar cargar contexto ajeno.
      schema:
        type: string
        format: uuid
    RoomLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    RecordId:
      name: record_id
      in: path
      required: true
      description: Identificador del registro durable.
      schema:
        type: string
        format: uuid
    KnowledgeQuery:
      name: q
      in: query
      required: false
      description: Consulta de texto completo con sintaxis web de PostgreSQL.
      schema:
        type: string
        maxLength: 500
    KnowledgeLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 250
        default: 100
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Identificador opaco del proyecto.
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      description: Identificador opaco de la sesión activa.
      schema:
        type: string
        format: uuid
    IntentId:
      name: intent_id
      in: path
      required: true
      description: Identificador opaco de la intención coordinada.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitation_id
      in: path
      required: true
      description: Identificador opaco de una invitación.
      schema:
        type: string
        format: uuid
    AdminPrincipalId:
      name: principal_id
      in: path
      required: true
      description: Identificador de la cuenta humana administrada.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave elegida por el cliente para hacer idempotente la creación. Repetir
        la clave con el mismo cuerpo devuelve el resultado guardado; reutilizarla
        con un cuerpo diferente produce un conflicto.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AfterCursor:
      name: after
      in: query
      required: false
      description: Cursor exclusivo del último evento ya procesado.
      schema:
        $ref: "#/components/schemas/EventCursor"
    BeforeCursor:
      name: before
      in: query
      required: false
      description: Cursor exclusivo para cargar eventos anteriores cuando `order=desc`.
      schema:
        $ref: "#/components/schemas/EventCursor"
    EventLimit:
      name: limit
      in: query
      required: false
      description: Número máximo de eventos que se devolverán.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    EventOrder:
      name: order
      in: query
      required: false
      description: Orden de lectura. `desc` comienza por los eventos más recientes.
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    EventSearch:
      name: q
      in: query
      required: false
      description: Búsqueda de texto en el tipo, referencias, identidades y datos del evento.
      schema:
        type: string
        maxLength: 200
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Cursor exclusivo del último evento SSE procesado.
      schema:
        $ref: "#/components/schemas/EventCursor"
  schemas:
    ProjectRole:
      type: string
      enum: [owner, maintainer, contributor, viewer]
    PrincipalResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Principal"
    Principal:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - display_name
        - principal_type
        - organization_role
        - bootstrap
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        display_name:
          type: string
        principal_type:
          type: string
          enum:
            - human
            - service
        organization_role:
          type: string
          enum:
            - owner
            - admin
            - member
        bootstrap:
          type: boolean
    UserAdminDirectoryResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserAdminDirectory"
    UserAdminDirectory:
      type: object
      additionalProperties: false
      required: [users, invitations, events, generated_at]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/OrganizationUser" }
        invitations:
          type: array
          items: { $ref: "#/components/schemas/OrganizationInvitation" }
        events:
          type: array
          items: { $ref: "#/components/schemas/UserAdminEvent" }
        generated_at: { type: string, format: date-time }
    OrganizationUserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/OrganizationUser" }
    OrganizationUser:
      type: object
      additionalProperties: false
      required:
        - principal_id
        - display_name
        - email
        - username
        - status
        - organization_role
        - project_roles
        - active_sessions
        - active_devices
        - created_at
        - updated_at
      properties:
        principal_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        username: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,31}$" }
        status: { type: string, enum: [active, disabled] }
        organization_role: { type: string, enum: [owner, admin, member] }
        project_roles:
          type: array
          items: { $ref: "#/components/schemas/UserProjectPermission" }
        active_sessions: { type: integer, format: int64, minimum: 0 }
        active_devices: { type: integer, format: int64, minimum: 0 }
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserProjectPermission:
      type: object
      additionalProperties: false
      required: [project_id, project_name, project_slug, role]
      properties:
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        project_slug: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
    UpdateOrganizationUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        username: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,31}$" }
        status: { type: string, enum: [active, disabled] }
        organization_role: { type: string, enum: [owner, admin, member] }
    OrganizationInvitation:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - organization_role
        - status
        - expires_at
        - created_at
        - created_by_principal_id
        - created_by_display_name
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        organization_role: { type: string, enum: [owner, admin, member] }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        project_role: { $ref: "#/components/schemas/ProjectRole" }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        created_by_principal_id: { type: string, format: uuid }
        created_by_display_name: { type: string }
    CreateOrganizationInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, organization_role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        organization_role: { type: string, enum: [owner, admin, member] }
        project_id: { type: string, format: uuid }
        project_role: { $ref: "#/components/schemas/ProjectRole" }
        expires_in_hours: { type: integer, minimum: 1, maximum: 168, default: 24 }
    CreatedOrganizationInvitationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [invitation, secret]
          properties:
            invitation: { $ref: "#/components/schemas/OrganizationInvitation" }
            secret: { type: string, writeOnly: true, pattern: "^pact_inv_" }
    UserAdminEvent:
      type: object
      additionalProperties: false
      required: [id, action, actor_principal_id, actor_display_name, details, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        actor_principal_id: { type: string, format: uuid }
        actor_display_name: { type: string }
        target_principal_id: { type: string, format: uuid }
        target_display_name: { type: string }
        details: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          type: string
          enum:
            - owner
            - maintainer
            - contributor
            - viewer
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
    Invitation:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - email
        - role
        - status
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - maintainer
            - contributor
            - viewer
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expires_at:
          type: string
          format: date-time
    CreatedInvitationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - invitation
            - secret
          properties:
            invitation:
              $ref: "#/components/schemas/Invitation"
            secret:
              type: string
              writeOnly: true
              pattern: "^pact_inv_[A-Za-z0-9_-]+$"
              description: Se muestra una sola vez y debe transferirse por un canal privado.
    AccountRegistrationRequest:
      type: object
      additionalProperties: true
      required:
        - display_name
        - email
        - username
        - password
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{2,31}$"
        password:
          type: string
          writeOnly: true
          minLength: 15
          maxLength: 128
    DeviceAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [device_code, user_code, verification_uri, expires_at, interval_seconds]
          properties:
            device_code:
              type: string
              writeOnly: true
              pattern: "^pact_device_code_"
            user_code:
              type: string
              pattern: "^[A-Z2-7]{4}-[A-Z2-7]{4}$"
            verification_uri:
              type: string
              format: uri-reference
            expires_at:
              type: string
              format: date-time
            interval_seconds:
              type: integer
              minimum: 1
    DeviceExchangeResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [pending, authorized]
            device_credential:
              type: string
              writeOnly: true
              pattern: "^pact_device_"
            credential_id:
              type: string
              format: uuid
            principal:
              $ref: "#/components/schemas/Principal"
            expires_at:
              type: string
              format: date-time
    LivenessResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: live
    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: ready
    VersionResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/VersionInfo"
    VersionInfo:
      type: object
      additionalProperties: false
      required:
        - version
        - commit
        - date
      properties:
        version:
          type: string
          minLength: 1
        commit:
          type: string
          minLength: 1
        date:
          type: string
          minLength: 1
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
          maxLength: 4000
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          default: "#c9ee4d"
        project_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - color
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    WorkspaceProject:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - initializing
            - active
            - archived
        root_repository_remote_url:
          type: string
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - description
        - color
        - status
        - projects
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
        status:
          type: string
          enum:
            - active
            - archived
        projects:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceProject"
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
    WorkspaceResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Workspace"
    WorkspaceListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - workspaces
          properties:
            workspaces:
              type: array
              items:
                $ref: "#/components/schemas/Workspace"
    ResourceKind:
      type: string
      enum: [url, repository, document, pull_request, ticket, meeting, dashboard, infrastructure, other]
    ResourceClassification:
      type: string
      enum: [public, internal, confidential, restricted]
    CreateResourceRequest:
      type: object
      additionalProperties: false
      required: [kind, title, locator]
      properties:
        kind:
          $ref: "#/components/schemas/ResourceKind"
        title:
          type: string
          minLength: 1
          maxLength: 300
        locator:
          type: string
          minLength: 1
          maxLength: 4096
          description: No puede incluir credenciales ni parámetros que aparenten contener secretos.
        description:
          type: string
          maxLength: 10000
        classification:
          $ref: "#/components/schemas/ResourceClassification"
        metadata:
          type: object
          additionalProperties: true
    KnowledgeResource:
      type: object
      additionalProperties: false
      required: [id, workspace_id, kind, title, locator, description, classification, status, metadata, created_by_actor_id, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ResourceKind"
        title:
          type: string
        locator:
          type: string
        description:
          type: string
        classification:
          $ref: "#/components/schemas/ResourceClassification"
        status:
          type: string
          enum: [active, archived]
        metadata:
          type: object
          additionalProperties: true
        created_by_actor_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
    ResourceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/KnowledgeResource"
    ResourceListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [resources]
          properties:
            resources:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgeResource"
    RecordType:
      type: string
      enum: [decision, requirement, constraint, assumption, risk, open_question, finding, procedure, incident, validation_result, note]
    RecordStatus:
      type: string
      enum: [proposed, accepted, disputed, superseded, revoked, expired, rejected]
    RecordAuthority:
      type: string
      enum: [informational, team, organization, external]
    EvidenceRelation:
      type: string
      enum: [supports, contradicts, origin, validates]
    EvidenceInput:
      type: object
      additionalProperties: false
      required: [resource_id]
      properties:
        resource_id:
          type: string
          format: uuid
        relation:
          $ref: "#/components/schemas/EvidenceRelation"
        note:
          type: string
          maxLength: 4000
    RecordEvidence:
      type: object
      additionalProperties: false
      required: [relation, note, resource, created_at]
      properties:
        relation:
          $ref: "#/components/schemas/EvidenceRelation"
        note:
          type: string
        resource:
          $ref: "#/components/schemas/KnowledgeResource"
        created_at:
          type: string
          format: date-time
    CreateRecordRequest:
      type: object
      additionalProperties: false
      required: [type, title, body]
      properties:
        type:
          $ref: "#/components/schemas/RecordType"
        title:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          minLength: 1
          maxLength: 50000
        authority:
          $ref: "#/components/schemas/RecordAuthority"
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceInput"
        metadata:
          type: object
          additionalProperties: true
    KnowledgeRecord:
      type: object
      additionalProperties: false
      required: [id, workspace_id, type, title, body, status, authority, valid_from, metadata, created_by_actor_id, last_changed_by_actor_id, evidence, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/RecordType"
        title:
          type: string
        body:
          type: string
        status:
          $ref: "#/components/schemas/RecordStatus"
        authority:
          $ref: "#/components/schemas/RecordAuthority"
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        superseded_by_record_id:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: true
        created_by_actor_id:
          type: string
          format: uuid
        last_changed_by_actor_id:
          type: string
          format: uuid
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/RecordEvidence"
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateRecordStatusRequest:
      type: object
      additionalProperties: false
      required: [status, expected_version]
      properties:
        status:
          $ref: "#/components/schemas/RecordStatus"
        expected_version:
          type: integer
          format: int64
          minimum: 1
        reason:
