      responses:
        "201":
          description: Intención activa y leases de scopes creados.
          headers:
            Location:
              schema:
                type: string
            Idempotency-Replayed:
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartWorkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Scope reservado o conflicto de idempotencia.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScopeConflictProblem"
