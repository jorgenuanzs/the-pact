openapi: 3.1.0
info:
  title: Pact API
  version: 0.12.0
  description: |
    API del primer recorrido vertical de Pact.

    En modo local existe una organización implícita. Los clientes no crean ni
    seleccionan una organización mediante esta versión de la API.
servers:
  - url: http://127.0.0.1:8080
    description: Servidor local predeterminado
tags:
  - name: System
  - name: Backoffice
  - name: Projects
  - name: Repository Sync
  - name: GitHub Integration
  - name: Workspaces
  - name: Knowledge
  - name: Rooms
  - name: Events
  - name: Agents
  - name: Coordination
  - name: Handoffs
  - name: Context Packs
  - name: Access
  - name: Authentication
  - name: User Administration
paths:
  /livez:
    get:
      tags:
        - System
      operationId: getLiveness
      summary: Comprueba que el proceso está vivo
      description: |
        Esta comprobación no depende de PostgreSQL ni de otros servicios. Una
        respuesta correcta solo confirma que el proceso HTTP puede responder.
      responses:
        "200":
          description: El proceso está vivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
              example:
                data:
                  status: live
  /readyz:
    get:
      tags:
        - System
      operationId: getReadiness
      summary: Comprueba que Pact puede atender solicitudes
      description: |
        Pact está listo cuando terminó su arranque, el esquema de PostgreSQL es
        compatible y la base de datos está accesible. Durante el apagado vuelve
        a responder con 503.
      responses:
        "200":
          description: Pact está listo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                data:
                  status: ready
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /version:
    get:
      tags:
        - System
      operationId: getVersion
      summary: Obtiene la versión del servidor
      responses:
        "200":
          description: Versión en ejecución.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              example:
                data:
                  version: 0.1.0-dev
                  commit: unknown
                  date: unknown
  /admin/:
    get:
      tags:
        - Backoffice
      operationId: getLocalBackoffice
      summary: Abre el backoffice local de Pact
      description: |
        Entrega la interfaz HTML del backoffice. El documento no contiene datos
        del proyecto ni credenciales. El navegador inicia sesión con una cuenta
        local y recibe una cookie HttpOnly de corta duración. Las mutaciones
        requieren además el encabezado CSRF ligado a esa sesión.
      security: []
      responses:
        "200":
          description: Aplicación HTML del backoffice.
          headers:
            Cache-Control:
              description: El documento HTML no se almacena en caché.
              schema:
                type: string
                const: no-store
            Content-Security-Policy:
              description: Política que limita recursos y conexiones al mismo origen.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
  /v1/repository-bindings/resolve:
    post:
      tags:
        - Repositories
      operationId: resolveRepositoryBinding
      summary: Resuelve un remoto Git contra repositorios visibles
      description: |
        Compara una identidad Git normalizada con los repositorios vinculados
        a workspaces visibles para la identidad autenticada. Nunca recibe ni
        devuelve rutas locales y no revela coincidencias sin acceso.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRepositoryBindingRequest"
      responses:
        "200":
          description: Coincidencias visibles, posiblemente vacías.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveRepositoryBindingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/projects:
    get:
      tags:
        - Projects
        - Backoffice
      operationId: listProjects
      summary: Lista los proyectos de la organización local
      description: |
        Devuelve los proyectos visibles para la organización local implícita,
        ordenados desde el que se actualizó más recientemente.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de proyectos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
              example:
                data:
                  projects:
                    - id: 019c3fd8-2b34-7a10-8b75-3fd40dcfb68e
                      name: The Pact
                      slug: the-pact
                      status: initializing
                      canonical_revision: 3269b3f
                      version: 1
                      created_at: "2026-07-25T12:00:00Z"
                      updated_at: "2026-07-25T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Projects
      operationId: createProject
      summary: Crea un proyecto en la organización local
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              name: The Pact
              slug: the-pact
              canonical_revision: 3269b3f
              root_repository:
                slug: primary
                name: Primary
                remote_url: https://github.com/jorgenuanzs/the-pact
                default_branch: main
                object_format: sha1
      responses:
        "201":
          description: Proyecto creado.
          headers:
            Idempotency-Replayed:
              description: Presente y verdadero cuando se devuelve un resultado guardado.
              schema:
                type: string
                const: "true"
            Location:
              description: Ruta del proyecto creado.
              schema:
                type: string
                example: /v1/projects/019c3fd8-2b34-7a10-8b75-3fd40dcfb68e
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Projects
      operationId: getProject
      summary: Obtiene un proyecto
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Proyecto encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/projects/{project_id}/repository-sync:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Repository Sync
      operationId: getRepositorySync
      summary: Obtiene el último estado canónico verificado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado de sincronización del repositorio raíz.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositorySyncStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Repository Sync
      operationId: syncRepository
      summary: Verifica la rama y el commit canónicos directamente con GitHub
      description: Requiere rol maintainer del proyecto. No persiste la credencial de GitHub.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Sincronización completada, con o sin cambios materiales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositorySyncResultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: El proveedor del remoto no es compatible.
        "424":
          description: GitHub no pudo confirmar el estado canónico.
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/projects/{project_id}/repositories:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repository Sync]
      operationId: listProjectRepositories
      summary: Lista el conjunto de repositorios del proyecto
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Repositorios operativos y sus estados verificados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepositoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Repository Sync]
      operationId: attachProjectRepository
      summary: Vincula un repositorio autorizado de GitHub al proyecto
      description: Requiere rol maintainer del proyecto.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachProjectRepositoryRequest"
      responses:
        "201":
          description: Repositorio vinculado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepositoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects/{project_id}/repositories/{repository_id}/sync:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Repository Sync]
      operationId: getProjectRepositorySync
      summary: Obtiene el estado verificado de un repositorio del proyecto
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado de sincronización.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositorySyncStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Repository Sync]
      operationId: syncProjectRepository
      summary: Verifica un repositorio específico directamente con GitHub
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Sincronización completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositorySyncResultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "424":
          description: GitHub no pudo confirmar el estado del repositorio.
  /v1/integrations/github:
    get:
      tags: [GitHub Integration]
      operationId: getGitHubIntegration
      summary: Obtiene las instalaciones GitHub de la organización
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuración, instalaciones y cantidad de repositorios autorizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubIntegrationStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/integrations/github/connect:
    post:
      tags: [GitHub Integration]
      operationId: connectGitHub
      summary: Inicia una instalación oficial de GitHub App
      description: Requiere rol owner o admin de la organización.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: URL de instalación de un solo uso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/integrations/github/repositories:
    get:
      tags: [GitHub Integration]
      operationId: listAuthorizedGitHubRepositories
      summary: Lista repositorios GitHub autorizados para vincular
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Repositorios visibles para la instalación activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableGitHubRepositoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/integrations/github/callback:
    get:
      tags: [GitHub Integration]
      operationId: completeGitHubConnection
      summary: Procesa las fases Setup URL y OAuth de GitHub
      description: Endpoint público protegido mediante state de un solo uso y PKCE S256.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: installation_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: code
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Redirección a autorización GitHub o a Pact Control.
  /v1/integrations/github/webhook:
    post:
      tags: [GitHub Integration]
      operationId: receiveGitHubWebhook
      summary: Procesa cambios de instalaciones y repositorios autorizados
      description: Endpoint público validado mediante X-Hub-Signature-256 y X-GitHub-Delivery.
      security: []
      responses:
        "204":
          description: Entrega procesada o ya conocida.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/workspaces:
    get:
      tags:
        - Workspaces
      operationId: listWorkspaces
      summary: Lista los espacios de colaboración visibles
      description: Cada workspace reúne uno o más proyectos y será la frontera de contexto compartido de Pact.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de workspaces y sus proyectos visibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Workspaces
      operationId: createWorkspace
      summary: Crea un espacio de colaboración
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /v1/workspaces/events/stream:
    get:
      tags:
        - Workspaces
      operationId: streamWorkspaceDirectory
      summary: Sigue los cambios del directorio de workspaces mediante SSE
      description: |
        Mantiene sincronizada la lista de workspaces visible para la identidad
        autenticada. Emite `pact.workspace.directory.updated.v1` cuando cambia
        un workspace, sus proyectos vinculados o los permisos visibles. El
        cliente debe volver a consultar `/v1/workspaces` al recibirlo.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stream SSE abierto.
          headers:
            Cache-Control:
              description: Los streams no se almacenan en caché.
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: pact.workspace.directory.updated.v1
                data: {"type":"pact.workspace.directory.updated.v1","occurred_at":"2026-08-20T16:00:00Z"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/workspaces/{workspace_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        description: UUID o slug del workspace.
        schema:
          type: string
    get:
      tags:
        - Workspaces
      operationId: getWorkspace
      summary: Obtiene un workspace y sus proyectos visibles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspace encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Workspaces
      operationId: updateWorkspace
      summary: Actualiza la identidad visual de un workspace
      description: El slug permanece estable para no romper conexiones existentes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: Workspace actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /v1/workspaces/{workspace_id}/projects/{project_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ProjectId"
    put:
      tags:
        - Workspaces
      operationId: attachProjectToWorkspace
      summary: Mueve un proyecto al workspace
      description: Un proyecto pertenece a un único workspace. La operación no modifica el repositorio Git.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Proyecto asociado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspace_id}/resources:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Knowledge]
      operationId: listWorkspaceResources
      summary: Busca fuentes compartidas del Workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeQuery"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ResourceKind"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
        - $ref: "#/components/parameters/KnowledgeLimit"
      responses:
        "200":
          description: Fuentes visibles ordenadas por actividad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Knowledge]
      operationId: createWorkspaceResource
      summary: Registra una fuente compartida sin copiar su contenido
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: Fuente registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /v1/workspaces/{workspace_id}/records:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Knowledge]
      operationId: listWorkspaceRecords
      summary: Busca registros tipados de conocimiento
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeQuery"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/RecordType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RecordStatus"
        - $ref: "#/components/parameters/KnowledgeLimit"
      responses:
        "200":
          description: Registros visibles con su evidencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Knowledge]
      operationId: proposeWorkspaceRecord
      summary: Propone un registro de conocimiento con evidencia opcional
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordRequest"
      responses:
        "201":
          description: Registro creado en estado proposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
