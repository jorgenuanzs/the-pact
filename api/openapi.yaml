            - $ref: "#/components/schemas/RepositorySyncState"
            - type: "null"
        code_activity:
          $ref: "#/components/schemas/CodeActivity"
        counts:
          $ref: "#/components/schemas/BackofficeCounts"
        active_work:
          type: array
          items:
            $ref: "#/components/schemas/ActiveWork"
        recent_events:
          type: array
          items:
            $ref: "#/components/schemas/RecentEvent"
        work_items:
          type: array
          items:
            $ref: "#/components/schemas/WorkItem"
        handoffs:
          type: array
          items:
            $ref: "#/components/schemas/Handoff"
        generated_at:
          type: string
          format: date-time
    CodeActivity:
      type: object
      additionalProperties: false
      required:
        - state
        - reason
        - source
        - observed_at
        - observer_connected
        - observer_count
        - observer_freshness_seconds
        - active_window_seconds
        - recent_window_seconds
      properties:
        state:
          type: string
          enum:
            - unobserved
            - idle
            - editing
            - recent
        reason:
          type: string
          enum:
            - no_connected_observer
            - observer_connected_no_recent_change
            - fresh_workspace_diff
            - fresh_external_git_change
            - recent_workspace_diff
            - recent_external_git_change
            - recent_changeset
        source:
          type:
            - string
            - "null"
          description: Tipo del evento utilizado como evidencia, cuando existe.
        observed_at:
          type:
            - string
            - "null"
          format: date-time
          description: Hora de registro asignada por Pact Server al evento usado como evidencia.
        observer_connected:
          type: boolean
        observer_count:
          type: integer
          format: int64
          minimum: 0
        observer_freshness_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Ventana máxima desde el último heartbeat para considerar vigente un observador.
        active_window_seconds:
          type: integer
          format: int64
          minimum: 0
        recent_window_seconds:
          type: integer
          format: int64
          minimum: 0
    BackofficeCounts:
      type: object
      additionalProperties: false
      required:
        - repositories
        - live_sessions
        - connected_nodes
        - connected_observers
        - active_intents
        - blocked_intents
        - live_workspaces
        - active_scope_claims
        - pending_changesets
        - events
      properties:
        repositories:
          type: integer
          format: int64
          minimum: 0
        live_sessions:
          type: integer
          format: int64
          minimum: 0
        connected_nodes:
          type: integer
          format: int64
          minimum: 0
        connected_observers:
          type: integer
          format: int64
          minimum: 0
        active_intents:
          type: integer
          format: int64
          minimum: 0
        blocked_intents:
          type: integer
          format: int64
          minimum: 0
        live_workspaces:
          type: integer
          format: int64
          minimum: 0
        active_scope_claims:
          type: integer
          format: int64
          minimum: 0
        pending_changesets:
          type: integer
          format: int64
          minimum: 0
        events:
          type: integer
          format: int64
          minimum: 0
    ActiveWork:
      type: object
      additionalProperties: false
      required:
        - session_id
        - actor_id
        - actor_name
        - actor_kind
        - client_type
        - session_status
        - last_seen_at
        - expires_at
        - node_id
        - node_name
        - node_status
        - intent_id
        - intent_title
        - intent_status
        - workspace_id
        - workspace_status
        - workspace_branch
        - workspace_path_ref
      properties:
        session_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        actor_name:
          type: string
          minLength: 1
        actor_kind:
          type: string
          minLength: 1
        client_type:
          type: string
          minLength: 1
        session_status:
          type: string
          minLength: 1
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        node_id:
          type:
            - string
            - "null"
          format: uuid
        node_name:
          type:
            - string
            - "null"
        node_status:
          type:
            - string
            - "null"
        intent_id:
          type:
            - string
            - "null"
          format: uuid
        intent_title:
          type:
            - string
            - "null"
        intent_status:
          type:
            - string
            - "null"
        workspace_id:
          type:
            - string
            - "null"
          format: uuid
        workspace_status:
          type:
            - string
            - "null"
        workspace_branch:
          type:
            - string
            - "null"
        workspace_path_ref:
          type:
            - string
            - "null"
    RecentEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - sequence
        - type
        - actor_id
        - actor_name
        - session_id
        - intent_id
        - occurred_at
        - data
      properties:
        id:
          type: string
          format: uuid
        sequence:
          $ref: "#/components/schemas/EventCursor"
        type:
          type: string
          minLength: 1
        actor_id:
          type:
            - string
            - "null"
          format: uuid
        actor_name:
          type:
            - string
            - "null"
        session_id:
          type:
            - string
            - "null"
          format: uuid
        intent_id:
          type:
            - string
            - "null"
          format: uuid
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    EventPageResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/EventPage"
    EventPage:
      type: object
      additionalProperties: false
      required:
        - events
        - next_cursor
        - has_more
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ProjectEvent"
        next_cursor:
          oneOf:
            - $ref: "#/components/schemas/EventCursor"
            - type: "null"
          description: Cursor del último evento incluido o null si no hay eventos.
        has_more:
          type: boolean
    EventCursor:
      type: string
      pattern: "^[0-9]+$"
      description: |
        Cursor opaco. En v0.1 se transporta como una cadena decimal compatible
        con un bigint de PostgreSQL.
      examples:
        - "481"
    ProjectEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - sequence
        - type
        - version
        - aggregate_type
        - aggregate_id
        - aggregate_version
        - command_id
        - correlation_id
        - occurred_at
        - recorded_at
        - data
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        sequence:
          $ref: "#/components/schemas/EventCursor"
        type:
          type: string
          minLength: 1
          examples:
            - pact.project.created.v1
        version:
          type: integer
          minimum: 1
        aggregate_type:
          type: string
          minLength: 1
        aggregate_id:
          type: string
          minLength: 1
        aggregate_version:
          type: integer
          format: int64
          minimum: 1
        command_id:
          type: string
          format: uuid
        actor_id:
          type:
            - string
            - "null"
          format: uuid
        session_id:
          type:
            - string
            - "null"
          format: uuid
        intent_id:
          type:
            - string
            - "null"
          format: uuid
        causation_id:
          type:
            - string
            - "null"
        correlation_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    ScopeConflictProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required:
            - overlaps
          properties:
            overlaps:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/ScopeOverlap"
    Problem:
      type: object
      description: Error compatible con Problem Details para HTTP APIs.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Código estable y legible por máquinas.
        request_id:
          type: string
  responses:
    WebSessionCreated:
      description: Sesión web creada; las credenciales se entregan únicamente como cookies.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        Set-Cookie:
          description: Cookies pact_session (HttpOnly) y pact_csrf.
          schema:
            type: string
    BadRequest:
      description: La solicitud no tiene una forma o un valor válido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Falta una sesión web o credencial de dispositivo válida.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: La identidad es válida, pero no tiene el rol requerido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: El recurso no existe o no es visible para el actor.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        El slug ya existe o una clave de idempotencia se reutilizó con un cuerpo
        diferente.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: El cuerpo debe utilizar Content-Type application/json.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Pact todavía no está listo o está apagándose.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: Fallo interno no atribuible al cliente.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
