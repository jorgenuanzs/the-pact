    get:
      tags:
        - Access
        - Projects
      operationId: getProjectAccess
      summary: Lista el acceso efectivo y los agentes conocidos de un proyecto
      description: |
        Incluye membresías directas y acceso heredado de propietarios o
        administradores de la organización. Los agentes se atribuyen a la
        persona que los patrocina y solo aparecen si tienen historial de sesión
        en este proyecto. `connected` representa una sesión activa y reciente.
      security:
        - bearerAuth: []
      responses:
