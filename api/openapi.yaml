  /v1/projects/{project_id}/work-items:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Coordination
      operationId: listProjectWork
      summary: Lista el trabajo coordinado e histórico del proyecto
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Intenciones con responsable, scopes, workspace y presencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Coordination
      operationId: startProjectWork
      summary: Declara una intención y reserva sus scopes
      description: |
        Los scopes son exclusivos por defecto. PACT serializa la comprobación y
        la creación por proyecto para impedir que dos solicitudes concurrentes
        obtengan la misma reserva. `allow_overlap` es una anulación explícita y
        queda registrada en el evento durable.
      security:
        - bearerAuth: []
      parameters:
