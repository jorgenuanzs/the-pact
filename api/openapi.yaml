    get:
      tags:
        - Access
        - Workspaces
      operationId: getWorkspaceAccess
      summary: Lista el acceso efectivo y los agentes conocidos de un workspace
      description: |
        Funciona aunque el workspace todavía no tenga repositorios. Incluye a
        propietarios y administradores de la organización, membresías directas
        del workspace y acceso heredado desde cualquiera de sus repositorios.
        Los agentes solo aparecen cuando tienen historial de sesión dentro del
        workspace; `connected` representa una sesión activa y reciente.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuarios con acceso y agentes asociados al workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAccessResponse"
