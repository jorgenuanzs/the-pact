openapi: 3.1.0
info:
  title: Pact API
  version: 0.3.0
  description: |
    API del primer recorrido vertical de Pact.

    En modo local existe una organización implícita. Los clientes no crean ni
    seleccionan una organización mediante esta versión de la API.
servers:
  - url: http://127.0.0.1:8080
    description: Servidor local predeterminado
tags:
  - name: System
  - name: Backoffice
  - name: Projects
  - name: Events
  - name: Agents
  - name: Access
paths:
  /livez:
    get:
      tags:
        - System
      operationId: getLiveness
      summary: Comprueba que el proceso está vivo
      description: |
        Esta comprobación no depende de PostgreSQL ni de otros servicios. Una
        respuesta correcta solo confirma que el proceso HTTP puede responder.
      responses:
        "200":
          description: El proceso está vivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
              example:
                data:
                  status: live
  /readyz:
    get:
      tags:
        - System
      operationId: getReadiness
      summary: Comprueba que Pact puede atender solicitudes
      description: |
        Pact está listo cuando terminó su arranque, el esquema de PostgreSQL es
        compatible y la base de datos está accesible. Durante el apagado vuelve
        a responder con 503.
      responses:
        "200":
          description: Pact está listo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                data:
                  status: ready
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /version:
    get:
      tags:
        - System
      operationId: getVersion
      summary: Obtiene la versión del servidor
      responses:
        "200":
          description: Versión en ejecución.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              example:
                data:
                  version: 0.1.0-dev
                  commit: unknown
                  date: unknown
  /admin/:
    get:
      tags:
        - Backoffice
      operationId: getLocalBackoffice
      summary: Abre el backoffice local de Pact
      description: |
        Entrega la interfaz HTML del backoffice. El documento no contiene datos
        del proyecto ni credenciales: la interfaz solicita el token local y lo
        utiliza para consultar las operaciones protegidas de la API.

        Este perfil está diseñado para ejecutarse en la interfaz de loopback y
        no debe exponerse a una red hasta incorporar el modelo de autenticación
        y permisos para equipos.
      security: []
      responses:
        "200":
          description: Aplicación HTML del backoffice.
          headers:
            Cache-Control:
              description: El documento HTML no se almacena en caché.
              schema:
                type: string
                const: no-store
            Content-Security-Policy:
              description: Política que limita recursos y conexiones al mismo origen.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
  /v1/projects:
    get:
      tags:
        - Projects
        - Backoffice
      operationId: listProjects
      summary: Lista los proyectos de la organización local
      description: |
        Devuelve los proyectos visibles para la organización local implícita,
        ordenados desde el que se actualizó más recientemente.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de proyectos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
              example:
                data:
                  projects:
                    - id: 019c3fd8-2b34-7a10-8b75-3fd40dcfb68e
                      name: The Pact
                      slug: the-pact
                      status: initializing
                      canonical_revision: 3269b3f
                      version: 1
                      created_at: "2026-07-25T12:00:00Z"
                      updated_at: "2026-07-25T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Projects
      operationId: createProject
      summary: Crea un proyecto en la organización local
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              name: The Pact
              slug: the-pact
              canonical_revision: 3269b3f
              root_repository:
                slug: primary
                name: Primary
                remote_url: https://github.com/jorgenuanzs/the-pact
                default_branch: main
                object_format: sha1
      responses:
        "201":
          description: Proyecto creado.
          headers:
            Idempotency-Replayed:
              description: Presente y verdadero cuando se devuelve un resultado guardado.
              schema:
                type: string
                const: "true"
            Location:
              description: Ruta del proyecto creado.
              schema:
                type: string
                example: /v1/projects/019c3fd8-2b34-7a10-8b75-3fd40dcfb68e
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Projects
      operationId: getProject
      summary: Obtiene un proyecto
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Proyecto encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/projects/{project_id}/overview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Backoffice
        - Projects
      operationId: getProjectOverview
      summary: Obtiene el estado operativo de un proyecto
      description: |
        Reúne el estado observado del código, contadores de coordinación,
        trabajo activo y los eventos recientes del proyecto.

        `unobserved` significa que Pact no tiene un observador compatible
        conectado. No equivale a confirmar que el repositorio está inactivo.
        El estado `editing` solo se deriva de telemetría reciente emitida por
        un observador capaz de detectar cambios del workspace.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vista operativa actual del proyecto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOverviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/projects/{project_id}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Events
      operationId: listProjectEvents
      summary: Lista eventos duraderos de un proyecto
      description: |
        Devuelve eventos posteriores al cursor indicado y ordenados por su
        secuencia dentro del proyecto. Si `after` se omite, la lectura comienza
        antes del primer evento disponible.

        Aunque el cursor actual contiene la representación decimal de un
        `bigint`, los clientes deben tratarlo como una cadena opaca: solo deben
        almacenarlo y devolverlo, nunca realizar cálculos con él.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AfterCursor"
        - $ref: "#/components/parameters/EventLimit"
      responses:
        "200":
          description: Página de eventos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/projects/{project_id}/events/stream:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Events
      operationId: streamProjectEvents
      summary: Sigue los eventos de un proyecto mediante SSE
      description: |
        Primero reproduce los eventos duraderos posteriores a `Last-Event-ID` y
        después mantiene abierta la conexión para enviar eventos nuevos.

        Cada mensaje utiliza la secuencia del proyecto en el campo SSE `id`, el
        tipo del evento en `event` y el objeto `ProjectEvent` serializado como
        JSON en `data`. Los comentarios SSE pueden utilizarse como heartbeat y
        deben ignorarse. Si la conexión termina, el cliente debe reconectarse
        enviando el último `id` procesado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Stream SSE abierto.
          headers:
            Cache-Control:
              description: Los streams no se almacenan en caché.
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 1
                event: pact.project.created.v1
                data: {"id":"019c3fd8-2b34-7a10-8b75-3fd40dcfb68f","project_id":"019c3fd8-2b34-7a10-8b75-3fd40dcfb68e","sequence":"1","type":"pact.project.created.v1","version":1,"aggregate_type":"project","aggregate_id":"019c3fd8-2b34-7a10-8b75-3fd40dcfb68e","aggregate_version":1,"command_id":"019c3fd8-2b34-7a10-8b75-3fd40dcfb690","correlation_id":"019c3fd8-2b34-7a10-8b75-3fd40dcfb690","occurred_at":"2026-07-25T12:00:00Z","recorded_at":"2026-07-25T12:00:00Z","data":{"name":"The Pact","slug":"the-pact"}}

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/projects/{project_id}/agent-sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags:
        - Agents
      operationId: startAgentSession
      summary: Registra una ejecución activa de un agente en un computador conectado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAgentSessionRequest"
      responses:
        "201":
          description: Sesión iniciada.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/agent-sessions/{session_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags:
        - Agents
      operationId: heartbeatAgentSession
      summary: Renueva la presencia de una sesión de agente
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Presencia renovada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/agent-sessions/{session_id}/repository-observations:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags:
        - Agents
      operationId: observeSessionRepository
      summary: Registra el estado observado de un checkout Git
      description: |
        Solo el principal que patrocina la sesión puede informar esta
        observación. La sesión debe estar activa y haber anunciado la capacidad
        `workspace.diff.observe.v1`. El payload no contiene nombres ni contenido
        de archivos: incluye una huella calculada localmente, la cantidad de
        rutas cambiadas, rama y revisión.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryObservationRequest"
      responses:
        "200":
          description: Observación almacenada y, cuando corresponde, evento durable emitido.
          headers:
            Idempotency-Replayed:
              description: Presente y verdadero al devolver un resultado ya almacenado.
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryObservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/agent-sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags:
        - Agents
      operationId: closeAgentSession
      summary: Cierra una sesión de agente
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sesión cerrada.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/me:
    get:
      tags:
        - Access
      operationId: getCurrentPrincipal
      summary: Devuelve la identidad autenticada
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identidad actual.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/tokens/current:
    delete:
      tags:
        - Access
      operationId: revokeCurrentAccessToken
      summary: Revoca inmediatamente el token personal utilizado en la solicitud
      description: La credencial bootstrap no puede revocarse mediante este endpoint.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Token personal revocado.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/projects/{project_id}/invitations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags:
        - Access
      operationId: createProjectInvitation
      summary: Crea una invitación de proyecto de un solo uso
      description: |
        Requiere owner o maintainer. Solo la credencial bootstrap puede emitir
        una invitación owner para establecer el primer propietario humano.
        El secreto se devuelve una sola vez y nunca se guarda en texto plano.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitación creada.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /v1/invitations/{invitation_id}:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    delete:
      tags:
        - Access
      operationId: revokeProjectInvitation
      summary: Revoca una invitación pendiente
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Invitación revocada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/invitation-acceptances:
    post:
      tags:
        - Access
      operationId: acceptProjectInvitation
      summary: Canjea una invitación por una identidad y un token personal
      description: No requiere autenticación previa. El secreto de invitación es de un solo uso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "201":
          description: Invitación aceptada y token personal emitido.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token personal opaco y revocable, o credencial bootstrap de recuperación.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Identificador opaco del proyecto.
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      description: Identificador opaco de la sesión activa.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitation_id
      in: path
      required: true
      description: Identificador opaco de una invitación.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave elegida por el cliente para hacer idempotente la creación. Repetir
        la clave con el mismo cuerpo devuelve el resultado guardado; reutilizarla
        con un cuerpo diferente produce un conflicto.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AfterCursor:
      name: after
      in: query
      required: false
      description: Cursor exclusivo del último evento ya procesado.
      schema:
        $ref: "#/components/schemas/EventCursor"
    EventLimit:
      name: limit
      in: query
      required: false
      description: Número máximo de eventos que se devolverán.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Cursor exclusivo del último evento SSE procesado.
      schema:
        $ref: "#/components/schemas/EventCursor"
  schemas:
    PrincipalResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Principal"
    Principal:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - display_name
        - principal_type
        - organization_role
        - bootstrap
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        display_name:
          type: string
        principal_type:
          type: string
          enum:
            - human
            - service
        organization_role:
          type: string
          enum:
            - owner
            - admin
            - member
        bootstrap:
          type: boolean
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          type: string
          enum:
            - owner
            - maintainer
            - contributor
            - viewer
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
    Invitation:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - email
        - role
        - status
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - maintainer
            - contributor
            - viewer
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expires_at:
          type: string
          format: date-time
    CreatedInvitationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - invitation
            - secret
          properties:
            invitation:
              $ref: "#/components/schemas/Invitation"
            secret:
              type: string
              writeOnly: true
              pattern: "^pact_inv_[A-Za-z0-9_-]+$"
              description: Se muestra una sola vez y debe transferirse por un canal privado.
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - secret
        - display_name
        - token_name
      properties:
        secret:
          type: string
          writeOnly: true
          pattern: "^pact_inv_[A-Za-z0-9_-]+$"
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        token_name:
          type: string
          minLength: 1
          maxLength: 200
    AcceptedInvitationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - principal
            - project_id
            - project_role
            - access_token
            - expires_at
          properties:
            principal:
              $ref: "#/components/schemas/Principal"
            project_id:
              type: string
              format: uuid
            project_role:
              type: string
              enum:
                - owner
                - maintainer
                - contributor
                - viewer
            access_token:
              type: string
              writeOnly: true
              pattern: "^pact_pat_[A-Za-z0-9_-]+$"
            expires_at:
              type: string
              format: date-time
    LivenessResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: live
    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: ready
    VersionResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/VersionInfo"
    VersionInfo:
      type: object
      additionalProperties: false
      required:
        - version
        - commit
        - date
      properties:
        version:
          type: string
          minLength: 1
        commit:
          type: string
          minLength: 1
        date:
          type: string
          minLength: 1
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        canonical_revision:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
          pattern: "^[0-9a-fA-F]{7,64}$"
          description: Revisión Git canónica inicial, si ya se conoce.
        root_repository:
          oneOf:
            - $ref: "#/components/schemas/SourceRepositoryInput"
            - type: "null"
          description: Repositorio Git principal que identifica el proyecto entre máquinas.
    SourceRepositoryInput:
      type: object
      additionalProperties: false
      required:
        - slug
        - name
        - remote_url
        - default_branch
        - object_format
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 1
          maxLength: 200
        remote_url:
          type: string
          minLength: 1
          maxLength: 2048
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
        object_format:
          type: string
          enum:
            - sha1
            - sha256
    ProjectResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Project"
    ProjectListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ProjectList"
    ProjectList:
      type: object
      additionalProperties: false
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - status
        - canonical_revision
        - root_repository
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - initializing
            - active
            - archived
        canonical_revision:
          type:
            - string
            - "null"
          maxLength: 64
          pattern: "^[0-9a-f]{7,64}$"
        root_repository:
          oneOf:
            - $ref: "#/components/schemas/SourceRepository"
            - type: "null"
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SourceRepository:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - vcs_type
        - status
        - remote_url
        - default_branch
        - object_format
        - version
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        vcs_type:
          type: string
          const: git
        status:
          type: string
          enum:
            - active
            - unavailable
            - archived
        remote_url:
          type:
            - string
            - "null"
          maxLength: 2048
        default_branch:
          type: string
        object_format:
          type: string
          enum:
            - sha1
            - sha256
        version:
          type: integer
          format: int64
          minimum: 1
    StartAgentSessionRequest:
      type: object
      additionalProperties: false
      required:
        - node_key
        - node_name
        - agent_name
        - agent_type
        - client_type
        - observe_git
      properties:
        node_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Identidad estable generada localmente para este computador y checkout.
        node_name:
          type: string
          minLength: 1
          maxLength: 200
        agent_name:
          type: string
          minLength: 1
          maxLength: 200
        agent_type:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - kimi
        client_type:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - kimi
        observe_git:
          type: boolean
          description: Declara si este proceso observa cambios Git del checkout.
    AgentSessionResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AgentSession"
    AgentSession:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - actor_id
        - actor_name
        - node_id
        - node_name
        - client_type
        - status
        - started_at
        - last_seen_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        actor_name:
          type: string
        node_id:
          type: string
          format: uuid
        node_name:
          type: string
        client_type:
          type: string
        status:
          type: string
          enum:
            - starting
            - active
            - stale
            - closed
            - expired
        started_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    RepositoryObservationRequest:
      type: object
      additionalProperties: false
      required:
        - dirty
        - diff_fingerprint
        - changed_paths
      properties:
        dirty:
          type: boolean
        diff_fingerprint:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
          description: SHA-256 del estado local del checkout; no es un diff ni revela rutas.
        changed_paths:
          type: integer
          minimum: 0
          maximum: 1000000
        head_revision:
          type: string
          minLength: 7
          maxLength: 64
          pattern: "^[0-9a-fA-F]+$"
        branch:
          type: string
          minLength: 1
          maxLength: 255
    RepositoryObservationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - observation
            - replayed
          properties:
            observation:
              $ref: "#/components/schemas/RepositoryObservation"
            event_id:
              type: string
              format: uuid
            event_type:
              type: string
              enum:
                - pact.workspace.diff_updated.v1
                - pact.git.external_change_detected.v1
            replayed:
              type: boolean
    RepositoryObservation:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - session_id
        - actor_id
        - node_id
        - dirty
        - diff_fingerprint
        - changed_paths
        - version
        - observed_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        dirty:
          type: boolean
        diff_fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        changed_paths:
          type: integer
          minimum: 0
        head_revision:
          type: string
          minLength: 7
          maxLength: 64
        branch:
          type: string
          minLength: 1
          maxLength: 255
        version:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type: string
          format: date-time
    ProjectOverviewResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ProjectOverview"
    ProjectOverview:
      type: object
      additionalProperties: false
      required:
        - project
        - code_activity
        - counts
        - active_work
        - recent_events
        - generated_at
      properties:
        project:
          $ref: "#/components/schemas/Project"
        code_activity:
          $ref: "#/components/schemas/CodeActivity"
        counts:
          $ref: "#/components/schemas/BackofficeCounts"
        active_work:
          type: array
          items:
            $ref: "#/components/schemas/ActiveWork"
        recent_events:
          type: array
          items:
            $ref: "#/components/schemas/RecentEvent"
        generated_at:
          type: string
          format: date-time
    CodeActivity:
      type: object
      additionalProperties: false
      required:
        - state
        - reason
        - source
        - observed_at
        - observer_connected
        - observer_count
        - observer_freshness_seconds
        - active_window_seconds
        - recent_window_seconds
      properties:
        state:
          type: string
          enum:
            - unobserved
            - idle
            - editing
            - recent
        reason:
          type: string
          enum:
            - no_connected_observer
            - observer_connected_no_recent_change
            - fresh_workspace_diff
            - fresh_external_git_change
            - recent_workspace_diff
            - recent_external_git_change
            - recent_changeset
        source:
          type:
            - string
            - "null"
          description: Tipo del evento utilizado como evidencia, cuando existe.
        observed_at:
          type:
            - string
            - "null"
          format: date-time
          description: Hora de registro asignada por Pact Server al evento usado como evidencia.
        observer_connected:
          type: boolean
        observer_count:
          type: integer
          format: int64
          minimum: 0
        observer_freshness_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Ventana máxima desde el último heartbeat para considerar vigente un observador.
        active_window_seconds:
          type: integer
          format: int64
          minimum: 0
        recent_window_seconds:
          type: integer
          format: int64
          minimum: 0
    BackofficeCounts:
      type: object
      additionalProperties: false
      required:
        - repositories
        - live_sessions
        - connected_nodes
        - connected_observers
        - active_intents
        - blocked_intents
        - live_workspaces
        - active_scope_claims
        - pending_changesets
        - events
      properties:
        repositories:
          type: integer
          format: int64
          minimum: 0
        live_sessions:
          type: integer
          format: int64
          minimum: 0
        connected_nodes:
          type: integer
          format: int64
          minimum: 0
        connected_observers:
          type: integer
          format: int64
          minimum: 0
        active_intents:
          type: integer
          format: int64
          minimum: 0
        blocked_intents:
          type: integer
          format: int64
          minimum: 0
        live_workspaces:
          type: integer
          format: int64
          minimum: 0
        active_scope_claims:
          type: integer
          format: int64
          minimum: 0
        pending_changesets:
          type: integer
          format: int64
          minimum: 0
        events:
          type: integer
          format: int64
          minimum: 0
    ActiveWork:
      type: object
      additionalProperties: false
      required:
        - session_id
        - actor_id
        - actor_name
        - actor_kind
        - client_type
        - session_status
        - last_seen_at
        - expires_at
        - node_id
        - node_name
        - node_status
        - intent_id
        - intent_title
        - intent_status
        - workspace_id
        - workspace_status
        - workspace_branch
        - workspace_path_ref
      properties:
        session_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        actor_name:
          type: string
          minLength: 1
        actor_kind:
          type: string
          minLength: 1
        client_type:
          type: string
          minLength: 1
        session_status:
          type: string
          minLength: 1
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        node_id:
          type:
            - string
            - "null"
          format: uuid
        node_name:
          type:
            - string
            - "null"
        node_status:
          type:
            - string
            - "null"
        intent_id:
          type:
            - string
            - "null"
          format: uuid
        intent_title:
          type:
            - string
            - "null"
        intent_status:
          type:
            - string
            - "null"
        workspace_id:
          type:
            - string
            - "null"
          format: uuid
        workspace_status:
          type:
            - string
            - "null"
        workspace_branch:
          type:
            - string
            - "null"
        workspace_path_ref:
          type:
            - string
            - "null"
    RecentEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - sequence
        - type
        - actor_id
        - session_id
        - intent_id
        - occurred_at
        - data
      properties:
        id:
          type: string
          format: uuid
        sequence:
          $ref: "#/components/schemas/EventCursor"
        type:
          type: string
          minLength: 1
        actor_id:
          type:
            - string
            - "null"
          format: uuid
        session_id:
          type:
            - string
            - "null"
          format: uuid
        intent_id:
          type:
            - string
            - "null"
          format: uuid
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    EventPageResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/EventPage"
    EventPage:
      type: object
      additionalProperties: false
      required:
        - events
        - next_cursor
        - has_more
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ProjectEvent"
        next_cursor:
          oneOf:
            - $ref: "#/components/schemas/EventCursor"
            - type: "null"
          description: Cursor del último evento incluido o null si no hay eventos.
        has_more:
          type: boolean
    EventCursor:
      type: string
      pattern: "^[0-9]+$"
      description: |
        Cursor opaco. En v0.1 se transporta como una cadena decimal compatible
        con un bigint de PostgreSQL.
      examples:
        - "481"
    ProjectEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - sequence
        - type
        - version
        - aggregate_type
        - aggregate_id
        - aggregate_version
        - command_id
        - correlation_id
        - occurred_at
        - recorded_at
        - data
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        sequence:
          $ref: "#/components/schemas/EventCursor"
        type:
          type: string
          minLength: 1
          examples:
            - pact.project.created.v1
        version:
          type: integer
          minimum: 1
        aggregate_type:
          type: string
          minLength: 1
        aggregate_id:
          type: string
          minLength: 1
        aggregate_version:
          type: integer
          format: int64
          minimum: 1
        command_id:
          type: string
          format: uuid
        actor_id:
          type:
            - string
            - "null"
          format: uuid
        session_id:
          type:
            - string
            - "null"
          format: uuid
        intent_id:
          type:
            - string
            - "null"
          format: uuid
        causation_id:
          type:
            - string
            - "null"
        correlation_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    Problem:
      type: object
      description: Error compatible con Problem Details para HTTP APIs.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Código estable y legible por máquinas.
        request_id:
          type: string
  responses:
    BadRequest:
      description: La solicitud no tiene una forma o un valor válido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Falta un Bearer token válido.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: La identidad es válida, pero no tiene el rol requerido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: El recurso no existe o no es visible para el actor.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        El slug ya existe o una clave de idempotencia se reutilizó con un cuerpo
        diferente.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: El cuerpo debe utilizar Content-Type application/json.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Pact todavía no está listo o está apagándose.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: Fallo interno no atribuible al cliente.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
