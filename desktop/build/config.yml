version: '3'

info:
  companyName: "Nuanzs"
  productName: "PACT"
  productIdentifier: "com.nuanzs.pact"
  description: "Live coordination and shared context for people and AI agents."
  copyright: "Copyright © 2026 Nuanzs"
  comments: "PACT Desktop"
  version: "0.15.1"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - localhelper
      - build/bin
    file:
      - .DS_Store
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations: []
