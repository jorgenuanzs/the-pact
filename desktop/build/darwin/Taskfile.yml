version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    platforms: [darwin]
    deps:
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - >-
        go build
        {{if ne .DEV "true"}}-tags production -trimpath -ldflags="-w -s -X main.currentVersion={{.DESKTOP_VERSION}} -X main.currentCommit={{.DESKTOP_COMMIT}}"{{else}}-gcflags=all="-l"{{end}}
        -buildvcs=false
        -o "{{.BIN_DIR}}/{{.APP_NAME}}"
    env:
      GOOS: darwin
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"

  package:
    platforms: [darwin]
    deps:
      - task: build
    cmds:
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/icons.icns"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  run:
    platforms: [darwin]
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
