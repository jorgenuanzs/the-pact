name: Deploy PACT Production

on:
  workflow_dispatch:
  push:
    tags:
      - "deploy-production-*"

permissions:
  contents: read

concurrency:
  group: pact-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to pact.nuanzs.com
    runs-on: [self-hosted, Linux, ARM64, pact-production]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Require main
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/deploy-production-*) ;;
            *)
              echo "Unsupported production deployment ref: ${GITHUB_REF}." >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Deploy immutable release
        env:
          PACT_DEPLOY_LOCAL: "true"
        run: ./deploy/oci-shared/deploy.sh
      - name: Verify public readiness
        run: curl --fail --show-error --silent https://pact.nuanzs.com/readyz
