name: PACT Desktop

on:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "desktop/**"
      - "web/**"
      - "internal/access/**"
      - "internal/authn/**"
      - "internal/pactclient/**"
      - "internal/localserver/**"
      - "internal/userconfig/**"
      - "cmd/pact/**"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop.yml"
      - "desktop/**"
      - "web/**"
      - "internal/access/**"
      - "internal/authn/**"
      - "internal/pactclient/**"
      - "internal/localserver/**"
      - "internal/userconfig/**"
      - "cmd/pact/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            artifact: PACT-macOS-arm64
          - label: Windows amd64
            os: windows-latest
            artifact: PACT-Windows-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-nsis.ps1
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Test native layer
        working-directory: desktop
        run: |
          npm --prefix ../web run build:desktop
          node ../web/scripts/build-desktop-helper.mjs
          go test ./...
      - name: Test desktop frontend
        working-directory: web
        run: npm test -- --run src/features/desktop/DesktopGate.test.tsx src/features/desktop/LocalComputerPage.test.tsx src/api/client.test.ts
      - name: Build macOS application
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          GOARCH: arm64
        run: wails3 package GOOS=darwin
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent desktop/build/bin/PACT.app desktop/build/bin/PACT-macOS-arm64.zip
      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          GOARCH: amd64
        run: wails3 package GOOS=windows INSTALL_SCOPE=user
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/build/bin/*.zip
            desktop/build/bin/*-installer.exe
          if-no-files-found: error
