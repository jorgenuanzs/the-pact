name: Release Pact CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw scripts/install-windows.ps1)) | Out-Null'
      - name: Validate WinGet manifest generator
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sh -n scripts/install.sh
          bash -n scripts/generate-winget-manifests.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          BINARY=pact
          if [[ "${GOOS}" == "windows" ]]; then
            BINARY=pact.exe
          fi
          go build \
            -buildvcs=false \
            -trimpath \
            -ldflags="-s -w -X github.com/jorgenuanzs/the-pact/internal/buildinfo.Version=${VERSION} -X github.com/jorgenuanzs/the-pact/internal/buildinfo.Commit=${COMMIT} -X github.com/jorgenuanzs/the-pact/internal/buildinfo.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "${BINARY}" \
            ./cmd/pact
          if [[ "${GOOS}" == "windows" ]]; then
            zip -j "dist/pact_${GOOS}_${GOARCH}.zip" "${BINARY}"
          else
            tar -czf "dist/pact_${GOOS}_${GOARCH}.tar.gz" "${BINARY}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pact-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pact-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cp scripts/install.sh dist/install-pact.sh
          cp scripts/install-windows.ps1 dist/install-pact.ps1
          cd dist
          sha256sum pact_*.tar.gz pact_*.zip > checksums.txt
          AMD64_SHA="$(sha256sum pact_windows_amd64.zip | cut -d ' ' -f 1)"
          ARM64_SHA="$(sha256sum pact_windows_arm64.zip | cut -d ' ' -f 1)"
          cd ..
          bash scripts/generate-winget-manifests.sh \
            "${GITHUB_REF_NAME}" \
            "${AMD64_SHA}" \
            "${ARM64_SHA}" \
            dist/winget
          cd dist/winget
          zip -j ../winget_manifests.zip ./*.yaml
          cd ..
          rm -rf winget
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag

  smoke-windows:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Install the published release
        shell: pwsh
        env:
          PACT_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "install-pact.ps1"
          Invoke-WebRequest `
            "https://github.com/${{ github.repository }}/releases/download/$env:PACT_RELEASE_TAG/install-pact.ps1" `
            -OutFile $installer
          & $installer `
            -Version $env:PACT_RELEASE_TAG `
            -InstallDir (Join-Path $env:RUNNER_TEMP "Pact") `
            -NoPathUpdate
          & (Join-Path $env:RUNNER_TEMP "Pact\pact.exe") help

  smoke-unix:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Install the published release
        shell: bash
        env:
          PACT_VERSION: ${{ github.ref_name }}
          PACT_INSTALL_DIR: ${{ runner.temp }}/pact-bin
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/${{ github.repository }}/releases/download/${PACT_VERSION}/install-pact.sh" \
            --output "${RUNNER_TEMP}/install-pact.sh"
          sh "${RUNNER_TEMP}/install-pact.sh"
          "${PACT_INSTALL_DIR}/pact" help
