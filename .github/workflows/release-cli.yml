name: Release PACT

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web applications
        working-directory: web
        run: npm run build
      - name: Test web applications
        if: runner.os == 'Linux'
        working-directory: web
        run: npm test
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: Validate release support files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sh -n scripts/install.sh
          bash -n scripts/deploy-production.sh scripts/publish-desktop.sh scripts/publish-desktop_test.sh
          bash scripts/publish-desktop_test.sh
          bash -n scripts/generate-winget-manifests.sh
          node scripts/set-desktop-version.mjs "${GITHUB_REF_NAME}"
          docker compose --env-file deploy/self-host/.env.example --file deploy/self-host/compose.yaml config --quiet
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw scripts/install-windows.ps1)) | Out-Null'

  build-cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          BINARY=pact
          if [[ "${GOOS}" == "windows" ]]; then
            BINARY=pact.exe
          fi
          go build \
            -buildvcs=false \
            -trimpath \
            -ldflags="-s -w -X github.com/jorgenuanzs/the-pact/internal/buildinfo.Version=${VERSION} -X github.com/jorgenuanzs/the-pact/internal/buildinfo.Commit=${COMMIT} -X github.com/jorgenuanzs/the-pact/internal/buildinfo.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "${BINARY}" \
            ./cmd/pact
          if [[ "${GOOS}" == "windows" ]]; then
            zip -j "dist/pact_${GOOS}_${GOARCH}.zip" "${BINARY}"
          else
            tar -czf "dist/pact_${GOOS}_${GOARCH}.tar.gz" "${BINARY}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pact-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-desktop:
    name: Desktop (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            os: macos-latest
            artifact: PACT-macOS-arm64
          - label: Windows-amd64
            os: windows-latest
            artifact: PACT-Windows-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Apply product version
        shell: bash
        run: |
          node scripts/set-desktop-version.mjs "${GITHUB_REF_NAME}"
          (cd desktop/build && wails3 update build-assets -name PACT -binaryname PACT -config config.yml -dir .)
      - name: Report native Desktop signing status
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            required=(MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID)
          else
            required=(WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD)
          fi
          configured=0
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] && configured=$((configured + 1))
          done
          if [[ "${configured}" -eq 0 ]]; then
            echo "::warning::${RUNNER_OS} Desktop artifacts will be published without native publisher signing. Update archives still require Ed25519 verification."
          elif [[ "${configured}" -ne "${#required[@]}" ]]; then
            echo "Incomplete ${RUNNER_OS} signing configuration" >&2
            exit 1
          else
            echo "${RUNNER_OS} native publisher signing is configured."
          fi
      - name: Build macOS application
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          export PACT_VERSION="${GITHUB_REF_NAME#v}"
          export PACT_COMMIT="${GITHUB_SHA}"
          export GOARCH=arm64
          wails3 package GOOS=darwin
      - name: Sign, notarize, and archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -Eeuo pipefail
          APP="desktop/build/bin/PACT.app"
          if [[ -n "${MACOS_CERTIFICATE:-}" ]]; then
            [[ -n "${MACOS_CERTIFICATE_PASSWORD:-}" && -n "${MACOS_SIGNING_IDENTITY:-}" ]] || { echo "Incomplete macOS signing secrets" >&2; exit 1; }
            KEYCHAIN="${RUNNER_TEMP}/pact-signing.keychain-db"
            CERTIFICATE="${RUNNER_TEMP}/pact-signing.p12"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            cleanup() { security delete-keychain "${KEYCHAIN}" >/dev/null 2>&1 || true; rm -f "${CERTIFICATE}"; }
            trap cleanup EXIT
            printf '%s' "${MACOS_CERTIFICATE}" | openssl base64 -d -A -out "${CERTIFICATE}"
            security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN}"
            security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
            security import "${CERTIFICATE}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN}"
            security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
            security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db
            codesign --force --deep --options runtime --timestamp --sign "${MACOS_SIGNING_IDENTITY}" "${APP}"
            codesign --verify --deep --strict --verbose=2 "${APP}"
            [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]] || { echo "Apple notarization secrets are incomplete" >&2; exit 1; }
            ditto -c -k --sequesterRsrc --keepParent "${APP}" "${RUNNER_TEMP}/PACT-notarize.zip"
            xcrun notarytool submit "${RUNNER_TEMP}/PACT-notarize.zip" --apple-id "${APPLE_ID}" --password "${APPLE_APP_PASSWORD}" --team-id "${APPLE_TEAM_ID}" --wait
            xcrun stapler staple "${APP}"
            xcrun stapler validate "${APP}"
          else
            echo "Apple signing secrets are absent; publishing an unsigned Desktop preview."
          fi
          ditto -c -k --sequesterRsrc --keepParent "${APP}" desktop/build/bin/PACT-macOS-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent "${APP}" desktop/build/bin/PACT-darwin-arm64.zip
      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $env:PACT_VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:PACT_COMMIT = $env:GITHUB_SHA
          $env:GOARCH = "amd64"
          wails3 package GOOS=windows INSTALL_SCOPE=user
      - name: Sign and normalize Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Resolve-Path "desktop/build/bin/PACT.exe"
          if ($env:WINDOWS_CERTIFICATE) {
            if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Incomplete Windows signing secrets" }
            $certificate = Join-Path $env:RUNNER_TEMP "pact-signing.pfx"
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Where-Object FullName -Like "*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe was not found" }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD $binary
            Push-Location "desktop/build/windows/nsis"
            try {
              & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DARG_WAILS_AMD64_BINARY=..\..\bin\PACT.exe" "/DWAILS_INSTALL_SCOPE=user" "/DREQUEST_EXECUTION_LEVEL=user" project.nsi
            } finally {
              Pop-Location
            }
          } else {
            Write-Host "Windows signing secrets are absent; publishing an unsigned Desktop preview."
          }
          $installer = Get-ChildItem "desktop/build/bin" -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "Wails did not produce an NSIS installer" }
          if ($env:WINDOWS_CERTIFICATE) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
            Remove-Item $certificate -Force
          }
          $destination = "desktop/build/bin/PACT-Windows-amd64-installer.exe"
          if ($installer.FullName -ne (Join-Path (Get-Location) $destination)) {
            Copy-Item $installer.FullName $destination -Force
          }
          Compress-Archive -Path $binary -DestinationPath "desktop/build/bin/PACT-windows-amd64.zip" -Force
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/build/bin/PACT-macOS-arm64.zip
            desktop/build/bin/PACT-darwin-arm64.zip
            desktop/build/bin/PACT-Windows-amd64-installer.exe
            desktop/build/bin/PACT-windows-amd64.zip
          if-no-files-found: error

  publish-server:
    name: Publish PACT Server image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release
    needs:
      - build-cli
      - build-desktop
      - publish-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: pact-cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: PACT-*
          path: dist
          merge-multiple: true
      - name: Sign native update artifacts
        env:
          PACT_UPDATER_PRIVATE_KEY: ${{ secrets.PACT_UPDATER_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "${PACT_UPDATER_PRIVATE_KEY:-}" ]] || { echo "PACT_UPDATER_PRIVATE_KEY is required for every Desktop release" >&2; exit 1; }
          go run ./cmd/pact-sign-update -file dist/PACT-darwin-arm64.zip
          go run ./cmd/pact-sign-update -file dist/PACT-windows-amd64.zip
      - name: Assemble release bundle
        env:
          PACT_VERSION: ${{ github.ref_name }}
          PACT_COMMIT: ${{ github.sha }}
          PACT_DESKTOP_CHANNEL: ${{ (secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' && secrets.PACT_UPDATER_PRIVATE_KEY != '') && 'signed' || 'preview' }}
        run: |
          printf '%s\n' "${PACT_DESKTOP_CHANNEL}" > "dist/desktop-channel-${PACT_DESKTOP_CHANNEL}.txt"
          cp scripts/install.sh dist/install-pact.sh
          cp scripts/install-windows.ps1 dist/install-pact.ps1
          mkdir -p dist/self-host
          cp deploy/self-host/compose.yaml deploy/self-host/.env.example deploy/self-host/README.md dist/self-host/
          sed -i "s|ghcr.io/jorgenuanzs/the-pact:VERSION|ghcr.io/jorgenuanzs/the-pact:${GITHUB_REF_NAME}|" dist/self-host/.env.example
          (cd dist/self-host && zip -r ../pact-server-self-host.zip compose.yaml .env.example README.md)
          rm -rf dist/self-host
          AMD64_SHA="$(sha256sum dist/pact_windows_amd64.zip | cut -d ' ' -f 1)"
          ARM64_SHA="$(sha256sum dist/pact_windows_arm64.zip | cut -d ' ' -f 1)"
          bash scripts/generate-winget-manifests.sh "${GITHUB_REF_NAME}" "${AMD64_SHA}" "${ARM64_SHA}" dist/winget
          (cd dist/winget && zip -j ../winget_manifests.zip ./*.yaml)
          rm -rf dist/winget
          node scripts/create-release-manifest.mjs dist
          (cd dist && for file in *; do [[ -f "${file}" && "${file}" != checksums.txt ]] && sha256sum "${file}"; done > checksums.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arguments=(--repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag --title "PACT ${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${arguments[@]}"

  smoke-cli-windows:
    name: Smoke CLI (Windows)
    needs: release
    runs-on: windows-latest
    steps:
      - name: Install the published release
        shell: pwsh
        env:
          PACT_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "install-pact.ps1"
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/$env:PACT_RELEASE_TAG/install-pact.ps1" -OutFile $installer
          & $installer -Version $env:PACT_RELEASE_TAG -InstallDir (Join-Path $env:RUNNER_TEMP "Pact") -NoPathUpdate
          & (Join-Path $env:RUNNER_TEMP "Pact\pact.exe") version

  smoke-cli-unix:
    name: Smoke CLI (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Install the published release
        shell: bash
        env:
          PACT_VERSION: ${{ github.ref_name }}
          PACT_INSTALL_DIR: ${{ runner.temp }}/pact-bin
        run: |
          curl --fail --location --retry 3 "https://github.com/${{ github.repository }}/releases/download/${PACT_VERSION}/install-pact.sh" --output "${RUNNER_TEMP}/install-pact.sh"
          sh "${RUNNER_TEMP}/install-pact.sh"
          "${PACT_INSTALL_DIR}/pact" version

  smoke-server:
    name: Smoke PACT Server image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Pull and inspect the published image
        run: |
          docker pull "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          docker run --rm "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}" version
