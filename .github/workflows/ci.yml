name: Pact CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw scripts/install-windows.ps1)) | Out-Null'
      - name: Validate WinGet manifest generator
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sh -n scripts/install.sh
          bash -n scripts/generate-winget-manifests.sh
          OUTPUT_DIRECTORY="$(mktemp -d)"
          HASH=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          bash scripts/generate-winget-manifests.sh v1.2.3 "$HASH" "$HASH" "$OUTPUT_DIRECTORY"
          test -f "$OUTPUT_DIRECTORY/Nuanzs.Pact.installer.yaml"
          grep -q 'PackageVersion: 1.2.3' "$OUTPUT_DIRECTORY/Nuanzs.Pact.yaml"

  build-windows:
    name: Build Windows (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile native Windows CLI
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build -buildvcs=false -trimpath -o pact.exe ./cmd/pact

  smoke-installer-windows:
    name: Install latest release on Windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Install from the latest GitHub release
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "install-pact.ps1"
          Invoke-WebRequest `
            "https://github.com/jorgenuanzs/the-pact/releases/latest/download/install-pact.ps1" `
            -OutFile $installer
          & $installer `
            -InstallDir (Join-Path $env:RUNNER_TEMP "Pact") `
            -NoPathUpdate
          & (Join-Path $env:RUNNER_TEMP "Pact\pact.exe") help
