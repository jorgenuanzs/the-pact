name: ${COMPOSE_PROJECT_NAME:-the-pact}

x-pact-build: &pact-build
  context: .
  target: runtime
  args:
    VERSION: ${PACT_VERSION:-dev}
    COMMIT: ${PACT_COMMIT:-unknown}
    BUILD_DATE: ${PACT_BUILD_DATE:-unknown}

x-pact-environment: &pact-environment
  PACT_DATABASE_URL: >-
    postgres://${PACT_DB_USER:-pact}:${PACT_DB_PASSWORD:?Set PACT_DB_PASSWORD in .env}@postgres:5432/${PACT_DB_NAME:-pact}?sslmode=disable
  PACT_DATABASE_TIMEOUT: ${PACT_DATABASE_TIMEOUT:-5s}
  PACT_DATABASE_STATEMENT_TIMEOUT: ${PACT_DATABASE_STATEMENT_TIMEOUT:-15s}
  PACT_DATABASE_LOCK_TIMEOUT: ${PACT_DATABASE_LOCK_TIMEOUT:-5s}
  PACT_LOG_LEVEL: ${PACT_LOG_LEVEL:-debug}
  PACT_LOCAL_ORGANIZATION_ID: ${PACT_LOCAL_ORGANIZATION_ID:-00000000-0000-4000-8000-000000000001}
  PACT_SHUTDOWN_TIMEOUT: ${PACT_SHUTDOWN_TIMEOUT:-10s}

x-pact-container: &pact-container
  image: ${PACT_SERVER_IMAGE:-the-pact-server:dev}
  build: *pact-build
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie@sha256:b7337db8fe39d12fe8ecb0003c72680f24479813a744b43154eee6f2eab5a5f3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PACT_DB_NAME:-pact}
      POSTGRES_USER: ${PACT_DB_USER:-pact}
      POSTGRES_PASSWORD: ${PACT_DB_PASSWORD:?Set PACT_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pact_postgres_data:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *pact-container
    restart: "no"
    command:
      - migrate
      - up
    environment:
      <<: *pact-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    healthcheck:
      disable: true

  pact-server:
    <<: *pact-container
    restart: unless-stopped
    command:
      - serve
    environment:
      <<: *pact-environment
      PACT_HTTP_ADDRESS: 0.0.0.0:8080
      PACT_LOCAL_API_TOKEN: ${PACT_LOCAL_API_TOKEN:?Set PACT_LOCAL_API_TOKEN in .env}
      PACT_RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${PACT_HTTP_PORT:-8080}:8080
    networks:
      - private
      - edge
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/readyz
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 15s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  postgres-test:
    image: pgvector/pgvector:0.8.2-pg18-trixie@sha256:b7337db8fe39d12fe8ecb0003c72680f24479813a744b43154eee6f2eab5a5f3
    profiles:
      - tools
    restart: "no"
    environment:
      POSTGRES_DB: pact_test
      POSTGRES_USER: ${PACT_DB_USER:-pact}
      POSTGRES_PASSWORD: ${PACT_DB_PASSWORD:?Set PACT_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=512m
    networks:
      - private
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  integration-test:
    image: ${PACT_TEST_IMAGE:-the-pact-integration-test:dev}
    build:
      context: .
      target: source
    profiles:
      - tools
    init: true
    restart: "no"
    command:
      - go
      - test
      - -tags=integration
      - ./internal/projects
      - ./internal/access
      - ./internal/agentsession
      - ./internal/coordination
      - ./internal/workspaces
      - ./internal/knowledge
      - ./internal/contextpack
    environment:
      PACT_TEST_DATABASE_URL: >-
        postgres://${PACT_DB_USER:-pact}:${PACT_DB_PASSWORD:?Set PACT_DB_PASSWORD in .env}@postgres-test:5432/pact_test?sslmode=disable
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - private

volumes:
  pact_postgres_data:

networks:
  private:
    internal: true
  edge:
